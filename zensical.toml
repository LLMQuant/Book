# ============================================================================
# LLMQuant Book - Zensical Configuration
# Migrated from mkdocs.yml
# ============================================================================

[project]

# Site metadata
site_name = "LLMQuant Book"
site_url = "https://llmquant.github.io/llmquant-book/"
site_description = "人工智能与量化金融"
site_author = "LLMQuant"

# Documentation source directory
docs_dir = "docs"

# Repository configuration
repo_name = "LLMQuant/llmquant-book"
repo_url = "https://github.com/LLMQuant/llmquant-book"

# Copyright notice
copyright = """
Copyright &copy; 2026 LLMQuant
"""

# Navigation structure
nav = [
    { "Home" = "index.md" },
    { "前言" = "前言.md" },
    { "章节" = [
        { "第一章 人工智能在量化金融中的应用与趋势" = "01-人工智能在量化金融中的应用与趋势.md" },
        { "第二章 数据是量化交易+人工智能的血液" = "02-数据是量化交易+人工智能的血液.md" },
        { "第三章 情感分析可以作为量化交易的因子吗" = "03-情感分析可以作为量化交易的因子吗.md" },
        { "第四章 量化交易中的机器学习" = "04-量化交易中的机器学习.md" },
        { "第五章 量化实战不尽如意吗" = "05-量化实战不尽如意吗.md" },
        { "第六章 极端事件下人工智能模型的抗风险能力" = "06-端事件下人工智能模型的抗风险能力.md" },
        { "第七章 LLM智能体在量化金融中的应用与未来" = "07-LLM智能体在量化金融中的应用与未来.md" },
    ]},
    { "参考文献" = "reference.md" },
]

# MathJax for mathematical equations
extra_javascript = ["https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"]

# Custom CSS for styling overrides
extra_css = ["stylesheets/extra.css"]

# ----------------------------------------------------------------------------
# Theme configuration
# ----------------------------------------------------------------------------
[project.theme]

# Language setting (Chinese)
language = "zh"

# Logo and favicon
logo = "assets/logo-b.png"
favicon = "assets/logo-b.png"

# Feature toggles
features = [
    # Navigation features
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tracking",
    "navigation.expand",
    "navigation.top",
    "navigation.footer",
    "navigation.indexes",

    # Search features
    "search.suggest",
    "search.highlight",

    # Content features
    "content.code.copy",
    "content.code.annotate",
    "content.code.select",
    "content.tabs.link",
    "content.footnote.tooltips",
    "content.tooltips",
]

# ----------------------------------------------------------------------------
# Color palette - Light/Dark mode toggle
# Using custom brand colors (brick red + amber/gold)
# ----------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "切换到暗色模式"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "切换到亮色模式"

# ----------------------------------------------------------------------------
# Font configuration
# ----------------------------------------------------------------------------
[project.theme.font]
text = "Noto Sans SC"
code = "JetBrains Mono"

# ----------------------------------------------------------------------------
# Social links
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/LLMQuant"
