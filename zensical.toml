# MathJax for mathematical equations
extra_javascript = ["https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"]

# Custom CSS for styling overrides
extra_css = ["stylesheets/extra.css"]

# ----------------------------------------------------------------------------
# Theme configuration
# ----------------------------------------------------------------------------
[project.theme]

# Language setting (Chinese)
language = "zh"

# Logo and favicon
logo = "assets/logo-b.png"
favicon = "assets/logo-b.png"

# Feature toggles
features = [
    # Navigation features
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tracking",
    "navigation.expand",
    "navigation.top",
    "navigation.footer",
    "navigation.indexes",

    # Search features
    "search.suggest",
    "search.highlight",

    # Content features
    "content.code.copy",
    "content.code.annotate",
    "content.code.select",
    "content.tabs.link",
    "content.footnote.tooltips",
    "content.tooltips",
]

# ----------------------------------------------------------------------------
# Color palette - Light/Dark mode toggle
# Using custom brand colors (brick red + amber/gold)
# ----------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "切换到暗色模式"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "切换到亮色模式"

# ----------------------------------------------------------------------------
# Font configuration
# ----------------------------------------------------------------------------
[project.theme.font]
text = "Noto Sans SC"
code = "JetBrains Mono"

# ----------------------------------------------------------------------------
# Social links
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/LLMQuant"
